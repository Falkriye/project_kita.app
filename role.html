<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Pilih Peran — ProjectKita</title>
<meta name="theme-color" content="#0b1e3d" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/favicon-32.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-shell">
    <div class="role-page">
      <div class="role-topbar">
        <span class="brand">ProjectKita</span>
        <button class="help" type="button" id="helpBtn">Bantuan</button>
      </div>

      <h1>Pilih Peran Anda</h1>
      <p class="role-sub">Sesuaikan pengalaman Anda di platform ProjectKita.</p>

      <div class="role-options" role="radiogroup" aria-label="Pilih peran">

        <button type="button" class="role-card" id="roleClient" role="radio" aria-checked="false" data-role="client">
          <span class="role-radio" aria-hidden="true"></span>
          <span class="role-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M3 9h18"/><circle cx="8" cy="13" r="1.5"/><path d="M13 12.5h5M13 15h3"/></svg>
          </span>
          <h3>Saya Client</h3>
          <p>Saya ingin mencari talent profesional untuk mengerjakan proyek bisnis saya.</p>
        </button>

        <button type="button" class="role-card" id="roleTalent" role="radio" aria-checked="false" data-role="talent">
          <span class="role-radio" aria-hidden="true"></span>
          <span class="role-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h5M8 16h8"/></svg>
          </span>
          <h3>Saya Talent</h3>
          <p>Saya adalah freelancer yang ingin menawarkan jasa dan mencari proyek impian.</p>
        </button>

      </div>

      <div class="role-footer">
        <button type="button" class="btn btn-primary" id="continueBtn" disabled>Lanjutkan</button>
        <p class="auth-switch">Sudah punya akun? <a href="login.html">Masuk di Sini</a></p>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/app.js"></script>
  <script src="js/role.js"></script>
</body>
</html>
