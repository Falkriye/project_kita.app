<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ProjectKita — Solusi Cepat untuk Setiap Project</title>
<meta name="description" content="ProjectKita menghubungkan client dan talent freelance profesional di Indonesia." />
<meta name="theme-color" content="#0b1e3d" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/favicon-32.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="ProjectKita" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- One-time animated boot splash with the app logo -->
  <div class="boot-splash" id="bootSplash">
    <div class="boot-logo"><img src="icons/icon-192.png" alt="" /></div>
    <span>ProjectKita</span>
  </div>

  <div class="app-shell">
    <main class="splash">
      <div class="splash-logo-row">
        <div class="splash-logo-badge"><img src="icons/icon-192.png" alt="Logo ProjectKita" /></div>
        <span>ProjectKita</span>
      </div>

      <div class="splash-illustration">
        <img src="icons/icon-512.png" alt="Ilustrasi client dan talent berkolaborasi lewat ProjectKita" />
      </div>

      <div class="splash-copy">
        <h1>Solusi Cepat untuk Setiap Project</h1>

        <div class="splash-actions">
          <a class="btn btn-primary" href="login.html">
            Mulai Sekarang
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </a>
          <a class="btn btn-secondary" href="login.html?guest=1">Lihat Marketplace</a>
        </div>
      </div>

      <div class="splash-features">
        <span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          Safe Payment
        </span>
        <span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
          24/7 Support
        </span>
        <span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2l3 6 6 .9-4.5 4.4 1 6.2-5.5-3-5.5 3 1-6.2L3 8.9 9 8z"/></svg>
          Expert Talents
        </span>
      </div>

      <div class="splash-footer">© 2024 ProjectKita. Made with Professionalism.</div>
    </main>
  </div>

  <script src="js/app.js"></script>
  <script src="js/splash.js"></script>
</body>
</html>
