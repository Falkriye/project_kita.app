DB.projects.unshift(p);notify('fa-briefcase','Project "'+p.title+'" berhasil dipublikasikan');save();toast('Project dipublikasikan ✅');go('/project/'+p.id)}
function vProfile(){const u=me(),mine=DB.projects.filter(p=>p.client==u.name);
return `<div class="pk p-4 mb-3"><div class="d-flex gap-3 align-items-center">${av(u.name,76)}<div class="flex-grow-1"><h5 class="mb-0">${esc(u.name)}</h5><small class="mut">@${esc(u.username)} · ${u.role=='talent'?'Talent':'Client'}</small><div class="small mut">${esc(u.email)}</div><div class="mt-1"><span class="badge-pk">${u.code}</span> <span class="badge-pk">${u.role=='talent'?'Talent':'Client'}</span> <span class="badge-pk" style="background:rgba(16,185,129,.12);color:#059669">Aktif</span></div></div><button class="btn btn-out btn-sm" onclick="editProf()"><i class="fa fa-pen"></i> Edit</button></div><p class="mt-3 mb-0">${esc(u.bio)}</p></div>
<div class="row g-3"><div class="col-lg-6"><div class="pk p-3 h-100"><h6>Skill</h6>${u.skills.length?u.skills.map(s=>`<div class="mb-2"><div class="d-flex justify-content-between small"><span>${esc(s[0])}</span><span>${s[1]}%</span></div><div class="bar"><i data-w="${s[1]}"></i></div></div>`).join(''):'<small class="mut">Belum ada skill. Tambahkan lewat Edit.</small>'}<h6 class="mt-3">Pengalaman</h6><p class="small mut">${esc(u.exp)||'Belum diisi.'}</p><h6>Project Dikerjakan</h6>${u.done.length?u.done.map(d=>`<div class="small"><i class="fa fa-check blue"></i> ${esc(d)}</div>`).join(''):'<small class="mut">Belum ada.</small>'}${mine.length?`<h6 class="mt-3">Project Saya</h6>${mine.map(p=>`<div class="small blue" style="cursor:pointer" onclick="go('/project/${p.id}')">${esc(p.title)}</div>`).join('')}`:''}</div></div>
<div class="col-lg-6"><div class="pk p-3 h-100"><div class="d-flex justify-content-between mb-2"><h6 class="mb-0">Portofolio</h6><button class="btn btn-pk btn-sm" onclick="addPort()"><i class="fa fa-plus"></i> Tambah</button></div>${u.port.length?`<div class="row g-2">${u.port.map((p,i)=>`<div class="col-6"><div class="tile" style="background:linear-gradient(135deg,${G[p.c%6]})" onclick="view('${esc(p.t).replace(/'/g,'')}','${esc(p.d).replace(/'/g,'')}','${esc(p.l)}',${p.c%6})"><i class="fa ${cat(p.k).i}"></i></div><small class="d-block text-truncate">${esc(p.t)}</small></div>`).join('')}</div>`:empty('fa-images','Belum ada karya. Tambahkan portofoliomu!')}</div></div></div>
<div class="pk p-3 mt-3"><h6>Riwayat Transaksi</h6>${trxList()}</div><div class="d-flex flex-wrap gap-2 mt-3"><button class="btn btn-out flex-grow-1" onclick="switchRole()"><i class="fa fa-repeat"></i> Ganti Peran</button><button class="btn btn-out flex-grow-1" onclick="theme()"><i class="fa fa-moon"></i> Mode Gelap</button><button class="btn btn-out flex-grow-1 text-danger" onclick="logout()"><i class="fa fa-right-from-bracket"></i> Keluar</button></div>`}
function editProf(){const u=me();modal('Edit Profil',`<input class="form-control mb-2" id="en" value="${esc(u.name)}" placeholder="Nama"><textarea class="form-control mb-2" id="eb" rows="3" placeholder="Bio">${esc(u.bio)}</textarea><input class="form-control mb-2" id="es" value="${esc(u.skills.map(s=>s[0]+':'+s[1]).join(', '))}" placeholder="Skill:level, mis. Figma:85, Canva:70"><input class="form-control" id="ex" value="${esc(u.exp)}" placeholder="Pengalaman">`,()=>{if(en.value.trim().length<2){toast('Nama wajib diisi');return false}
u.name=en.value.trim();u.bio=eb.value.trim();u.exp=ex.value.trim();u.skills=es.value.split(',').map(s=>s.split(':')).filter(a=>a[0].trim()).map(a=>[a[0].trim(),Math.min(100,Math.max(10,+a[1]||70))]);save();toast('Profil diperbarui');route()})}
function addPort(){modal('Tambah Karya',`<div class="border rounded-3 p-3 text-center mb-2 mut" style="border-style:dashed!important"><i class="fa fa-cloud-arrow-up fs-3"></i><div class="small">Simulasi upload — gambar tidak disimpan</div></div><input class="form-control mb-2" id="wt" placeholder="Judul karya"><textarea class="form-control mb-2" id="wd" rows="2" placeholder="Deskripsi"></textarea><select class="form-select mb-2" id="wk">${SEED.cats.map(c=>`<option value="${c.id}">${c.n}</option>`).join('')}</select><input class="form-control" id="wl" placeholder="Link karya (https://...)">`,()=>{if(!wt.value.trim()){toast('Judul wajib diisi');return false}me().port.push({t:wt.value.trim(),d:wd.value.trim(),k:wk.value,l:/^https?:\/\//.test(wl.value)?wl.value:'',c:Math.floor(Math.random()*6)});save();toast('Karya ditambahkan 🎨');route()})}
const dgal=()=>`<h6 class="mb-2">Contoh Hasil Desain Grafis</h6><div class="row g-3 mb-4">${SEED.designs.map((d,i)=>`<div class="col-6 col-md-3"><div class="pk p-2 h-100"><img class="dg" src="${d.src}" alt="${esc(d.t)}" onclick="viewImg(${i})"><div class="small fw-semibold mt-2">${d.t}</div><small class="mut">oleh ${T(d.by).name}</small></div></div>`).join('')}</div>`;
function viewImg(i){const d=SEED.designs[i];$('#vc').innerHTML=`<div class="d-flex flex-column align-items-center justify-content-center text-white text-center p-3 h-100" style="background:#0B1E3D"><button class="btn-close btn-close-white position-absolute" style="top:18px;right:18px;z-index:2" data-bs-dismiss="modal"></button><img src="${d.src}" alt="${esc(d.t)}" style="max-width:100%;max-height:72vh;border-radius:12px;object-fit:contain"><h5 class="mt-3 mb-1">${d.t}</h5><p class="small mb-0" style="max-width:520px;opacity:.85">${d.d}</p></div>`;bootstrap.Modal.getOrCreateInstance($('#vw')).show()}
function view(t,d,l,c){$('#vc').innerHTML=`<div class="d-flex flex-column align-items-center justify-content-center text-white text-center p-4 h-100" style="background:linear-gradient(135deg,${G[c]})"><button class="btn-close btn-close-white position-absolute" style="top:18px;right:18px" data-bs-dismiss="modal"></button><i class="fa fa-image" style="font-size:4rem;opacity:.85"></i><h3 class="mt-3">${t}</h3><p style="max-width:480px;opacity:.9">${d||''}</p>${l?`<a class="btn btn-light" href="${l}" target="_blank" rel="noopener">Buka Link Karya</a>`:''}</div>`;bootstrap.Modal.getOrCreateInstance($('#vw')).show()}
function vMsgs(){const ids=Object.keys(DB.chats).filter(k=>DB.chats[k].length);return `<h4 class="mb-3">Pesan</h4>${ids.length?ids.map(k=>{const t=T(k),m=DB.chats[k].at(-1);return `<div class="pk hov p-3 mb-2 d-flex gap-3 align-items-center" onclick="go('/chat/${k}')">${av(t.name)}<div class="flex-grow-1 overflow-hidden"><b>${t.name}</b><div class="small mut text-truncate">${esc(m.t)}</div></div><small class="mut">${m.h}</small></div>`}).join(''):empty('fa-comments','Belum ada percakapan.')}<h6 class="mt-4">Mulai chat baru</h6><div class="hs">${SEED.talents.filter(t=>!ids.includes(t.id)).map(t=>`<div class="pk hov p-3 text-center" onclick="go('/chat/${t.id}')">${av(t.name,52)}<div class="small fw-semibold mt-2">${t.name}</div></div>`).join('')}</div>`}
function vChat(id){const t=T(id);if(!t)return empty('fa-comments','Chat tidak ditemukan.');const c=DB.chats[id]||[];
return `<div class="d-flex align-items-center gap-2 mb-2"><button class="btn btn-out btn-sm" onclick="history.back()"><i class="fa fa-arrow-left"></i></button>${av(t.name,40)}<div><b>${t.name}</b><div class="small text-success">online</div></div></div><div class="pk p-3" id="chat" style="height:58vh;overflow-y:auto">${c.length?c.map(m=>bub(m)).join(''):'<div class="empty small">Mulai percakapan dengan '+t.name+'</div>'}</div>
<div class="d-flex gap-2 mt-2"><input class="form-control" id="ci" placeholder="Tulis pesan..." onkeydown="if(event.key=='Enter')send('${id}')"><button class="btn btn-pk px-3" onclick="send('${id}')"><i class="fa fa-paper-plane"></i></button></div>`}
const bub=m=>`<div class="msg ${m.me?'me':'th'}">${esc(m.t)}<div style="font-size:.65rem;opacity:.7;text-align:right">${m.h}</div></div>`;
function send(id){const v=ci.value.trim();if(!v)return;const c=DB.chats[id]=DB.chats[id]||[];const box=$('#chat');if(!c.length)box.innerHTML='';const m={me:1,t:v,h:now()};c.push(m);box.insertAdjacentHTML('beforeend',bub(m));ci.value='';box.scrollTop=box.scrollHeight;save();
setTimeout(()=>{const R=['Terima kasih sudah menghubungi! Boleh ceritakan detail kebutuhannya?','Siap, saya bisa bantu. Estimasi pengerjaan 3–5 hari ya.','Baik, nanti saya kirim contoh karya yang relevan.'],r={me:0,t:R[Math.floor(Math.random()*R.length)],h:now()};c.push(r);save();if(location.hash=='#/chat/'+id){box.insertAdjacentHTML('beforeend',bub(r));box.scrollTop=box.scrollHeight}else toast('Pesan baru dari '+T(id).name);notify('fa-envelope',T(id).name+' mengirim pesan')},1300)}
function vNotif(){const n=myN();setTimeout(()=>{n.forEach(x=>x.r=1);save();badge()},800);return `<div class="d-flex justify-content-between mb-3"><h4>Notifikasi</h4>${n.length?'<button class="btn btn-out btn-sm" onclick="DB.notifs=DB.notifs.filter(x=>x.u&&x.u!=me().id);save();route();badge()">Hapus semua</button>':''}</div>${n.length?n.map(x=>`<div class="pk p-3 mb-2 d-flex gap-3 align-items-center" style="${x.r?'':'border-left:4px solid var(--blue)'}"><div class="av" style="width:40px;height:40px;background:rgba(7,86,217,.12);color:var(--blue)"><i class="fa ${x.i}"></i></div><div><div class="small fw-semibold">${esc(x.t)}</div><small class="mut">${x.h}</small></div></div>`).join(''):empty('fa-bell-slash','Belum ada notifikasi.')}`}
function vBm(){const t=SEED.talents.filter(x=>DB.bm.includes(x.id)),p=DB.projects.filter(x=>DB.bm.includes(x.id));return `<h4 class="mb-3">Bookmark</h4>${t.length+p.length?`<div class="row g-3">${t.map(x=>`<div class="col-md-6">${tCard(x)}</div>`).join('')}${p.map(x=>`<div class="col-md-6">${pCard(x)}</div>`).join('')}</div>`:empty('fa-bookmark','Belum ada yang disimpan.')}`}
/* ===== PWA & THEME ===== */
function theme(){const d=document.documentElement.dataset.theme=='dark'?'light':'dark';document.documentElement.dataset.theme=d;LS.pk_theme=d}
document.documentElement.dataset.theme=LS.pk_theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
let dip;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;$('#inst').classList.remove('d-none')});
function install(){if(dip){dip.prompt();dip=null;$('#inst').classList.add('d-none')}}
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
document.addEventListener('click',e=>{const b=e.target.closest('.btn');if(!b)return;const r=b.getBoundingClientRect(),s=document.createElement('span'),z=Math.max(r.width,r.height);s.className='rip';s.style.cssText=`width:${z}px;height:${z}px;left:${e.clientX-r.left-z/2}px;top:${e.clientY-r.top-z/2}px`;b.append(s);setTimeout(()=>s.remove(),600)});
addEventListener('offline',()=>toast('Kamu offline — data lokal tetap tersedia'));addEventListener('online',()=>toast('Kembali online'));
/* ===== SPLASH ===== */
anim({targets:'#sl',scale:[.3,1],rotate:[-20,0],duration:900,easing:'easeOutElastic(1,.7)'});anim({targets:'#st',opacity:[0,1],translateY:[10,0],delay:400,duration:600});anim({targets:'#lb',width:'100%',duration:1600,easing:'easeInOutQuad'});
if(!window.anime){$('#st').style.opacity=1;$('#lb').style.width='100%';$('#sl').style.transform='none';$('#sl').style.opacity=1}
setTimeout(()=>{if(getComputedStyle($('#splash')).opacity==='1'){$('#splash').style.transition='opacity .4s';$('#splash').style.opacity=0;setTimeout(boot,400)}},1900);setTimeout(boot,4000);
</script></body></html>
