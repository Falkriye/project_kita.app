# Menjaga proyek Supabase (paket gratis) agar tidak dijeda karena sepi aktivitas.
# Simpan di repo dengan path: .github/workflows/keep-supabase-alive.yml
name: Keep Supabase alive

on:
  schedule:
    - cron: '17 2 * * *'   # setiap hari pukul 09.17 WIB
  workflow_dispatch:        # tombol "Run workflow" untuk uji manual

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database Supabase
        env:
          SB_URL: https://aezbrpujusjwqtwmqcee.supabase.co
          SB_KEY: sb_publishable_ZMeA-QKo7bSICo4Hu48RHA_iZntXAL9   # key publik (sama seperti di aplikasi), bukan rahasia
        run: |
          set -e
          echo "Ping Supabase..."
          # query nyata ke tabel profiles (RLS membuat hasilnya kosong untuk anonim, tapi database tetap bekerja)
          curl -fsS --retry 3 --retry-delay 10 \
            "$SB_URL/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: $SB_KEY" -o /dev/null -w "profiles: HTTP %{http_code}\n"
          # query kedua ke tabel review (boleh gagal tanpa menggagalkan job)
          curl -sS --retry 3 --retry-delay 10 \
            "$SB_URL/rest/v1/reviews?select=id&limit=1" \
            -H "apikey: $SB_KEY" -o /dev/null -w "reviews: HTTP %{http_code}\n" || true
          echo "Selesai."
